<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Vibrant Indigo/Cyan Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="200" r="130" fill="url(#accentGrad)" opacity="0.12" filter="url(#goldGlow)"/>

  <!-- CV Sheet Document Layer (Behind) -->
  <rect x="175" y="65" width="165" height="235" rx="14" fill="#1e293b" stroke="#334155" stroke-width="3" transform="rotate(6, 256, 180)" opacity="0.7"/>

  <!-- Main CV Sheet Document Layer (Front) -->
  <g filter="url(#goldGlow)">
    <rect x="148" y="70" width="180" height="240" rx="16" fill="#ffffff"/>
    
    <!-- Top Header Bar of CV -->
    <path d="M 148 86 C 148 77 155 70 164 70 L 312 70 C 321 70 328 77 328 86 L 328 120 L 148 120 Z" fill="url(#goldGrad)"/>

    <!-- Avatar Silhouette -->
    <circle cx="184" cy="95" r="14" fill="#0f172a"/>
    <path d="M 174 116 C 174 108 180 106 184 106 C 188 106 194 108 194 116 Z" fill="#0f172a"/>

    <!-- Name & Title Placeholder Lines on CV Header -->
    <rect x="208" y="88" width="70" height="7" rx="3.5" fill="#0f172a"/>
    <rect x="208" y="101" width="45" height="5" rx="2.5" fill="#334155"/>

    <!-- CV Section 1: Summary -->
    <rect x="168" y="136" width="40" height="6" rx="3" fill="#4f46e5"/>
    <rect x="168" y="148" width="140" height="4" rx="2" fill="#94a3b8"/>
    <rect x="168" y="156" width="125" height="4" rx="2" fill="#cbd5e1"/>

    <!-- CV Section 2: Experience / Timeline -->
    <rect x="168" y="174" width="50" height="6" rx="3" fill="#4f46e5"/>
    
    <!-- Bullet 1 -->
    <circle cx="172" cy="190" r="3" fill="#f59e0b"/>
    <rect x="180" y="188" width="128" height="4" rx="2" fill="#64748b"/>
    <rect x="180" y="196" width="105" height="4" rx="2" fill="#94a3b8"/>

    <!-- Bullet 2 -->
    <circle cx="172" cy="212" r="3" fill="#f59e0b"/>
    <rect x="180" y="210" width="128" height="4" rx="2" fill="#64748b"/>
    <rect x="180" y="218" width="115" height="4" rx="2" fill="#94a3b8"/>

    <!-- CV Section 3: Skills Pills -->
    <rect x="168" y="236" width="35" height="6" rx="3" fill="#4f46e5"/>
    <rect x="168" y="248" width="38" height="10" rx="5" fill="#e0e7ff"/>
    <rect x="212" y="248" width="42" height="10" rx="5" fill="#fef3c7"/>
    <rect x="260" y="248" width="35" height="10" rx="5" fill="#dcfce7"/>

    <rect x="168" y="264" width="48" height="10" rx="5" fill="#e0e7ff"/>
    <rect x="222" y="264" width="40" height="10" rx="5" fill="#f1f5f9"/>

    <rect x="168" y="284" width="140" height="3" rx="1.5" fill="#e2e8f0"/>
  </g>

  <!-- ATS Verified Badge (Bottom Right of CV) -->
  <g transform="translate(290, 240)" filter="url(#goldGlow)">
    <circle cx="28" cy="28" r="28" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <path d="M 28 8 L 44 14 L 44 26 C 44 37 37 46 28 50 C 19 46 12 37 12 26 L 12 14 Z" fill="url(#accentGrad)"/>
    <path d="M 21 28 L 26 33 L 36 21" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Typography Section -->
  <!-- "CV-ATS" Main Title -->
  <g>
    <text x="256" y="405" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="62" fill="url(#goldGrad)" letter-spacing="3">CV-ATS</text>
    
    <!-- Subtitle: Smart Resume Builder -->
    <text x="256" y="445" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="20" fill="#e2e8f0" letter-spacing="2">منصة السيرة الذاتية الذكية</text>
    <text x="256" y="472" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="4">SMART RESUME BUILDER</text>
  </g>
</svg>
