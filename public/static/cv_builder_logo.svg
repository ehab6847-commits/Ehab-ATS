<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="220" r="140" fill="url(#indigoGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Document Card Icon -->
  <g transform="translate(136, 90)">
    <!-- Main CV Sheet -->
    <rect x="20" y="20" width="200" height="260" rx="16" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>
    <path d="M 160 20 L 220 80 L 220 264 C 220 273 213 280 204 280 L 36 280 C 27 280 20 273 20 264 L 20 36 C 20 27 27 20 36 20 Z" fill="url(#goldGrad)"/>
    <path d="M 160 20 L 160 70 C 160 75 165 80 170 80 L 220 80 Z" fill="#b45309"/>

    <!-- Document Content Lines -->
    <rect x="48" y="60" width="85" height="12" rx="6" fill="#1e1b4b"/>
    <rect x="48" y="90" width="130" height="8" rx="4" fill="#6366f1"/>
    <rect x="48" y="110" width="144" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="48" y="124" width="120" height="6" rx="3" fill="#cbd5e1"/>

    <rect x="48" y="148" width="144" height="2" rx="1" fill="#fbbf24"/>

    <rect x="48" y="162" width="100" height="8" rx="4" fill="#4f46e5"/>
    <rect x="48" y="178" width="144" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="48" y="192" width="130" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Checkmark Badge -->
    <circle cx="180" cy="230" r="32" fill="#10b981"/>
    <path d="M 168 230 L 176 238 L 194 220" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Typography: CV Builder -->
  <text x="256" y="415" text-anchor="middle" font-family="'Inter', 'Cairo', 'Montserrat', sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" letter-spacing="2">CV BUILDER</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="700" font-size="22" fill="#94a3b8" letter-spacing="4">ATS RESUME SYSTEM</text>
</svg>
