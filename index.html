<script>
// ===== Service Worker Registration for Real Mobile App Experience =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').then(function(reg) {
      console.log('PWA ServiceWorker registered with scope:', reg.scope);
    }).catch(function(err) {
      console.log('PWA ServiceWorker registration failed:', err);
    });
  });
}

// ===== PWA Install Prompt Capture =====
window._pwaInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  window._pwaInstallPrompt = e;
});

window.triggerPWAInstall = function() {
  if (window._pwaInstallPrompt) {
    window._pwaInstallPrompt.prompt();
    window._pwaInstallPrompt.userChoice.then(function(choiceResult) {
      if (choiceResult.outcome === 'accepted') {
        if (typeof toast === 'function') toast('جاري تثبيت التطبيق على الجوال... 🎉');
      }
      window._pwaInstallPrompt = null;
    });
  } else {
    if (typeof openModal === 'function') {
      openModal(`
        <div class="text-center py-2">
          <div class="w-16 h-16 rounded-2xl mx-auto mb-3 shadow-xl border border-amber-400/40 p-1 bg-slate-900">
            <img src="/static/icon-192.png" class="w-full h-full object-contain rounded-xl" alt="App Icon">
          </div>
          <h3 class="font-bold text-lg mb-1">تثبيت التطبيق على الجوال 📲</h3>
          <p class="text-xs text-slate-300 mb-4">ليظهر التطبيق بأيقونته الرسمية المستقلة على شاشة هاتفك الرئيسية:</p>
          
          <div class="bg-slate-900/80 p-3.5 rounded-2xl text-xs space-y-2.5 text-right border border-slate-700 mb-4">
            <div class="flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0">1</span>
              <span>على <b>iPhone (Safari)</b>: اضغط زر المشاركة <i class="fas fa-arrow-up-from-bracket text-sky-400 mx-1"></i> بالأسفل، ثم اختر <b>"إضافة إلى الشاشة الرئيسية" (Add to Home Screen)</b>.</span>
            </div>
            <div class="flex items-start gap-2.5">
              <span class="w-5 h-5 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-xs shrink-0">2</span>
              <span>على <b>Android (Chrome)</b>: اضغط على القائمة (الثلاث نقاط) <i class="fas fa-ellipsis-vertical text-amber-400 mx-1"></i> بالأعلى، ثم اختر <b>"تثبيت التطبيق" (Install app)</b>.</span>
            </div>
          </div>
          
          <button class="btn-primary w-full !py-2" onclick="closeModal()">حسناً</button>
        </div>
      `, true);
    }
  }
};

// ===== INLINE OVERRIDE: Force pristine English from Arabic source =====
(function(){
  if (typeof window.renderTemplate !== 'function') return;
  var _origRender = window.renderTemplate;
  window.renderTemplate = function(templateId, data, cust, language) {
    if (!data || !data.sections) return _origRender(templateId, data, cust, language);
    var lang = language || 'ar';
    if (lang === 'en' || lang === 'bilingual') {
      var p = data.personal || {};
      if (p.nameAr && typeof translateArabicNameToEnglish === 'function') {
        p.nameEn = translateArabicNameToEnglish(p.nameAr);
      }
      if (p.titleAr && typeof translateTextToEnglish === 'function') {
        p.titleEn = translateTextToEnglish(p.titleAr);
      }
      if (p.cityAr && typeof translateTextToEnglish === 'function') {
        p.cityEn = translateTextToEnglish(p.cityAr);
      }
      (data.sections || []).forEach(function(sec) {
        if (sec.titleAr && typeof translateTextToEnglish === 'function') {
          sec.titleEn = translateTextToEnglish(sec.titleAr);
        }
        if (sec.textAr && typeof translateTextToEnglish === 'function') {
          sec.textEn = translateTextToEnglish(sec.textAr);
        }
        (sec.items || []).forEach(function(it) {
          ['role','org','company','degree','school','desc','name','level','issuer','text'].forEach(function(k) {
            var ar = it[k+'Ar'] || it[k];
            if (ar && typeof translateTextToEnglish === 'function') {
              it[k+'En'] = translateTextToEnglish(String(ar));
            }
          });
        });
      });
    }
    return _origRender(templateId, data, cust, language);
  };
})();
</script>
