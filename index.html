<script>
// ===== INLINE OVERRIDE: Force pristine English from Arabic source =====
// This runs AFTER all JS files load. Even if cached old files are used,
// this override guarantees correct bilingual and English rendering.
(function(){
  if (typeof window.renderTemplate !== 'function') return;
  var _origRender = window.renderTemplate;
  window.renderTemplate = function(templateId, data, cust, language) {
    if (!data || !data.sections) return _origRender(templateId, data, cust, language);
    var lang = language || 'ar';
    if (lang === 'en' || lang === 'bilingual') {
      // Force re-translate ALL fields from Arabic source
      var p = data.personal || {};
      if (p.nameAr && typeof translateArabicNameToEnglish === 'function') {
        p.nameEn = translateArabicNameToEnglish(p.nameAr);
      }
      if (p.titleAr && typeof translateTextToEnglish === 'function') {
        p.titleEn = translateTextToEnglish(p.titleAr);
      }
      if (p.cityAr && typeof translateTextToEnglish === 'function') {
        p.cityEn = translateTextToEnglish(p.cityAr);
      }
      (data.sections || []).forEach(function(sec) {
        if (sec.titleAr && typeof translateTextToEnglish === 'function') {
          sec.titleEn = translateTextToEnglish(sec.titleAr);
        }
        if (sec.textAr && typeof translateTextToEnglish === 'function') {
          sec.textEn = translateTextToEnglish(sec.textAr);
        }
        (sec.items || []).forEach(function(it) {
          ['role','org','company','degree','school','desc','name','level','issuer','text'].forEach(function(k) {
            var ar = it[k+'Ar'] || it[k];
            if (ar && typeof translateTextToEnglish === 'function') {
              it[k+'En'] = translateTextToEnglish(String(ar));
            }
          });
          // Fix name specifically for translateArabicNameToEnglish
          if (it.nameAr && typeof translateArabicNameToEnglish === 'function' && /[\u0621-\u064A]/.test(it.nameAr)) {
            // Only for person names, not skill names
          }
        });
      });
    }
    return _origRender(templateId, data, cust, language);
  };
  // Unregister any service workers that might cache old files
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { r.unregister(); });
    });
  }
})();
</script>
